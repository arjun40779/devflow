name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: postgres://devflow:devflow@localhost:5432/devflow
  REDIS_URL: redis://localhost:6379
  # Not real secrets — CI never makes live GitHub OAuth calls (fetch is mocked
  # in tests); these only need to satisfy apps/api's env schema.
  GITHUB_OAUTH_CLIENT_ID: ci-test-client-id
  GITHUB_OAUTH_CLIENT_SECRET: ci-test-client-secret
  SESSION_COOKIE_SECRET: ci-test-session-cookie-secret-0123456789ab

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devflow
          POSTGRES_PASSWORD: devflow
          POSTGRES_DB: devflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint --ui=stream

      - name: Typecheck
        run: pnpm turbo run typecheck --ui=stream

      - name: Test
        run: pnpm turbo run test --ui=stream

      - name: Build
        run: pnpm turbo run build --ui=stream
